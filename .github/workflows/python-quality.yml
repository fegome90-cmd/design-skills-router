name: Python quality

# Reject text I/O that depends on the platform's default encoding.
# Plan: docs/specs/calidad/plan-ci-calidad.md (PR A).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encoding:
    name: Explicit text encoding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Static guard over tracked Python files
        run: python -B scripts/check-encoding.py --summary

      - name: Build and install the CLI with MCP
        shell: bash
        run: |
          python -m pip install uv
          python -B packages/cli/build.py --out-dir "$RUNNER_TEMP/router-dist" --allow-network
          wheels=("$RUNNER_TEMP"/router-dist/*.whl)
          python -m pip install "${wheels[0]}[mcp]"
          python -c 'import mcp'

      # tests/test_security.py drives scripts/check-secrets.sh, which needs Gitleaks.
      # Same pinned release and checksum as .github/workflows/security.yml.
      - name: Install verified Gitleaks CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p security-bin
          tar -xzf gitleaks.tar.gz -C security-bin gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      # PYTHONWARNINGS also reaches the Python subprocesses that inherit the environment.
      - name: Test suites with EncodingWarning as an error
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: |
          (cd plugin && python -B -m unittest discover -s tests)
          python -B -m unittest discover -s packages/cli/tests -v
          python -B -m unittest discover -s telemetry/tests
          python -B -m unittest discover -s tests -v

      - name: Installed CLI tests under the C locale
        env:
          LC_ALL: C
          LANG: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: python -B scripts/run-cli-tests-locale-c.py

      - name: Package manifest and canonical tree
        run: |
          python -B plugin/skills/design-tree/scripts/doctor.py --format text
          python -B plugin/skills/design-tree/scripts/runner.py verify-package
