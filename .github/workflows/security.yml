name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secrets and private paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the candidate and its history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: incoming
          fetch-depth: 0
          persist-credentials: false

      - name: Load the base branch policy for pull requests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: policy
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Load the pinned policy for the initial pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.base.sha == 'a785efd51d7bc657ca05a3d54641b1f900227272'
        working-directory: incoming
        run: |
          mkdir -p ../policy/scripts
          git cat-file blob 64a6fb7f603dd10ee8b50053085f18ea6733e667 > ../policy/.gitleaks.toml
          git cat-file blob 5c3dab3d231061c4160a706c3ca0efd913d72114 > ../policy/scripts/check-secrets.sh
          git cat-file blob e497ede567c047dcdaac182f7f89bcc4e4a3230c > ../policy/scripts/check-sensitive-paths.py
          (cd ../policy && sha256sum -c - <<'SUMS'
          52c16374c2dc96216d9ac38d3db0019e0255ff80c35faa14970c52509b54f451  .gitleaks.toml
          cd0f2ac9e32534d5aec66d67dd89e00419e02282adef7c2ed37a794305a180ff  scripts/check-secrets.sh
          466cfd8f46fdff34fc8ad5941372dd11c3c9ed29f8152c7aaa5633627e7ffa41  scripts/check-sensitive-paths.py
          SUMS
          )
          chmod +x ../policy/scripts/check-secrets.sh

      - name: Install verified Gitleaks CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p security-bin
          tar -xzf gitleaks.tar.gz -C security-bin gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Scan committed files and history
        working-directory: incoming
        run: ../policy/scripts/check-secrets.sh history
